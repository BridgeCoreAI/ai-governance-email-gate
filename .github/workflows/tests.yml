name: Control tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run control and recovery tests
        run: python -m unittest discover -s tests -v
      - name: Run synthetic evidence demonstration
        run: python -m email_gate.demo > evidence-run.json
